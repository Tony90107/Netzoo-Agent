policy_version: 2
workflow: LIONESS-PANDA
action: run_lioness_panda
description: Infer aggregate PANDA and sample-specific LIONESS-PANDA networks.
required_inputs: [expression_file, motif_file, ppi_file, output_file, lioness_output]
optional_inputs: []
validation_steps: [inspect_inputs]
execution_step: run_lioness_panda
output_capability:
  operation: infer
  artifact_type: regulatory_network
  entity_types: [tf, gene]
  granularities: [aggregate, sample_specific]
  regulator_types: [tf]
  target_types: [gene]
  guidance_predecessors: [run_panda]
  input_artifacts: [expression_matrix]
  handoff_targets: []
  selection_tags: [sample_specific, tf_gene_regulation]
  handoff_contract: >-
    LIONESS-PANDA uses the original gene-by-sample expression matrix, motif and PPI
    priors to internally infer the aggregate PANDA network and derive sample-specific
    TF-to-gene networks. The PANDA predecessor is a guidance prerequisite, not a
    direct file handoff.
conventions:
  - Require at least three expression samples before execution.
  - Keep aggregate and sample-specific outputs distinct from every input.
  - 'For sample k, LIONESS uses the all-sample PANDA network and the PANDA network recomputed after removing k: N_k = n * N_all - (n - 1) * N_without_k.'
  - 'An aggregate COBRA adjusted co-expression artifact is not a direct LIONESS handoff; sample-specific COBRA adjustment would need to be recomputed inside each leave-one-out construction.'
  - When a patient or sample identifier is supplied, produce sample-specific networks for all available samples, select the requested sample afterward, and keep it separate from the aggregate network.
