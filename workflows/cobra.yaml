policy_version: 2
workflow: COBRA
action: run_cobra
description: Model covariate-associated gene co-expression with COBRA.
required_inputs: [expression_file, design_file, output_dir]
optional_inputs: []
validation_steps: [inspect_cobra_inputs]
execution_step: run_cobra
output_files:
  - manifest.json
  - components.npz
  - summary.tsv
  - adjusted_coexpression.tsv
  - adjusted_coexpression.npz
output_capability:
  operation: analyze
  artifact_type: coexpression_network
  entity_types: [gene]
  granularities: [aggregate]
  regulator_types: []
  target_types: []
  guidance_predecessors: []
  input_artifacts: [expression_matrix]
  handoff_targets: [run_panda, run_puma, run_otter]
  selection_tags: [covariate_association, hospital_effect_assessment, sequencing_batch_effect_assessment]
  handoff_contract: >-
    COBRA consumes a gene-by-sample expression matrix and numeric sample covariates,
    then produces a covariate-associated covariance decomposition and a labeled
    adjusted gene-by-gene co-expression artifact. PANDA, PUMA, or OTTER may consume
    the adjusted artifact through coexpression_file only after the downstream
    identifier/order contract is revalidated; the raw components are not a matrix
    input by themselves.
conventions:
  - Expression must be a labeled gene-by-sample matrix with more genes than samples.
  - Design rows must use exactly the expression sample IDs and numeric covariates.
  - run_cobra writes adjusted_coexpression.tsv and adjusted_coexpression.npz using the intercept component, with gene IDs on both axes.
