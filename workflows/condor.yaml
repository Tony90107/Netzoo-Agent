policy_version: 1
workflow: CONDOR
action: run_condor
description: Detect communities in a validated bipartite network with CONDOR.
required_inputs: [network_file, output_dir]
optional_inputs: [prefix]
validation_steps: [inspect_condor_inputs]
execution_step: run_condor
conventions:
  - Require source and target columns and accept an optional numeric weight column.
  - Report overlapping source and target IDs because the network should be bipartite.
