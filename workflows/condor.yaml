policy_version: 2
workflow: CONDOR
action: run_condor
description: Detect communities in a validated bipartite network with CONDOR.
required_inputs: [network_file, output_dir]
optional_inputs: [prefix]
validation_steps: [inspect_condor_inputs]
execution_step: run_condor
output_capability:
  operation: analyze
  artifact_type: community_assignment
  entity_types: [gene]
  granularities: [not_applicable]
  regulator_types: []
  target_types: []
  guidance_predecessors: []
conventions:
  - Require source and target columns and accept an optional numeric weight column.
  - Report overlapping source and target IDs because the network should be bipartite.
  - Build the source-target-weight edge list from a validated regulator-gene network; CONDOR does not consume the raw expression matrix directly.
  - For sample-specific networks, run community detection per sample and keep regulator-side and gene-side memberships distinct.
