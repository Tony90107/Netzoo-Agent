policy_version: 2
workflow: LIONESS-PUMA
action: run_lioness_puma
description: Infer aggregate PUMA and sample-specific LIONESS-PUMA networks.
required_inputs: [expression_file, motif_file, ppi_file, mirna_file, output_file, lioness_output]
optional_inputs: []
validation_steps: [inspect_inputs]
execution_step: run_lioness_puma
output_capability:
  operation: infer
  artifact_type: regulatory_network
  entity_types: [tf, mirna, gene]
  granularities: [aggregate, sample_specific]
  regulator_types: [tf, mirna]
  target_types: [gene]
  guidance_predecessors: [run_puma]
conventions:
  - Require at least three expression samples and a validated one-ID-per-line miRNA list.
  - Keep aggregate and sample-specific outputs distinct from every input.
