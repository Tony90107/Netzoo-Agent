policy_version: 2
workflow: LIONESS-PUMA
action: run_lioness_puma
description: Infer aggregate PUMA and sample-specific LIONESS-PUMA networks.
required_inputs: [expression_file, motif_file, ppi_file, mirna_file, output_file, lioness_output]
optional_inputs: []
validation_steps: [inspect_inputs]
execution_step: run_lioness_puma
output_capability:
  operation: infer
  artifact_type: regulatory_network
  entity_types: [tf, mirna, gene]
  granularities: [aggregate, sample_specific]
  regulator_types: [tf, mirna]
  target_types: [gene]
  guidance_predecessors: [run_puma]
  accepted_input_modalities: [gene_expression]
  produced_artifacts: [regulatory_network]
  incompatible_input_artifacts: [mutation_matrix]
  input_artifacts: [expression_matrix]
  handoff_targets: []
  selection_tags: [sample_specific, mirna_regulation]
  handoff_contract: >-
    LIONESS-PUMA uses the original gene-by-sample expression matrix, motif, PPI,
    and miRNA priors to internally infer the aggregate PUMA network and derive
    sample-specific TF/miRNA-to-gene networks. The PUMA predecessor is a guidance
    prerequisite, not a direct file handoff.
conventions:
  - Require at least three expression samples and a validated one-ID-per-line miRNA list.
  - Keep aggregate and sample-specific outputs distinct from every input.
  - 'For sample k, LIONESS uses the all-sample PUMA network and the PUMA network recomputed after removing k: N_k = n * N_all - (n - 1) * N_without_k.'
  - 'An aggregate COBRA adjusted co-expression artifact is not a direct LIONESS handoff; sample-specific COBRA adjustment would need to be recomputed inside each leave-one-out construction.'
  - When a patient or sample identifier is supplied, produce sample-specific networks for all available samples, select the requested sample afterward, and keep it separate from the aggregate network.
