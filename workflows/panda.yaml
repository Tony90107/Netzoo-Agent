policy_version: 2
workflow: PANDA
action: run_panda
description: Infer an aggregate TF-to-gene regulatory network with PANDA.
required_inputs: [expression_file, motif_file, ppi_file, output_file]
optional_inputs: [with_header]
validation_steps: [inspect_inputs]
execution_step: run_panda
output_capability:
  operation: infer
  artifact_type: regulatory_network
  entity_types: [tf, gene]
  granularities: [aggregate]
  regulator_types: [tf]
  target_types: [gene]
  guidance_predecessors: []
  input_artifacts: [expression_matrix]
  handoff_targets: [run_condor]
  selection_tags: [tf_gene_regulation, aggregate_network]
  handoff_contract: >-
    PANDA consumes a gene-by-sample expression matrix plus motif and PPI priors,
    and produces a weighted TF-to-gene regulatory network. Convert that network to
    a source-target-weight bipartite edge list before handing it to CONDOR.
conventions:
  - Use a gene-by-sample expression matrix and compatible motif and PPI identifiers.
  - Never substitute a co-expression matrix for the expression input of the current wrapper.
  - Batch correction, normalization, and identifier harmonization are upstream preprocessing; PANDA does not silently perform them.
  - Preserve biological covariates in the correction design and verify that hospital or sequencing batch is not completely confounded with the phenotype before inference.
