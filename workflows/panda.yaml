policy_version: 1
workflow: PANDA
action: run_panda
description: Infer an aggregate TF-to-gene regulatory network with PANDA.
required_inputs: [expression_file, motif_file, ppi_file, output_file]
optional_inputs: [with_header]
validation_steps: [inspect_inputs]
execution_step: run_panda
conventions:
  - Use a gene-by-sample expression matrix and compatible motif and PPI identifiers.
  - Never substitute a co-expression matrix for the expression input of the current wrapper.
