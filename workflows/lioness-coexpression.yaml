policy_version: 2
workflow: LIONESS-COEXPRESSION
action: run_lioness_coexpression
description: Infer aggregate and sample-specific co-expression networks with LIONESS.
required_inputs: [expression_file, output_file, lioness_output]
optional_inputs: []
validation_steps: []
execution_step: run_lioness_coexpression
output_capability:
  operation: infer
  artifact_type: coexpression_network
  entity_types: [gene]
  granularities: [aggregate, sample_specific]
  regulator_types: []
  target_types: []
  guidance_predecessors: []
  accepted_input_modalities: [gene_expression]
  produced_artifacts: [coexpression_network]
  incompatible_input_artifacts: [mutation_matrix]
  input_artifacts: [expression_matrix]
  handoff_targets: []
  selection_tags: [sample_specific, coexpression]
  handoff_contract: >-
    LIONESS co-expression consumes a gene-by-sample expression matrix and produces
    sample-specific co-expression networks.
conventions:
  - Require at least three samples and validate expression inside the execution wrapper.
  - Keep aggregate and sample-specific outputs distinct from the expression input.
  - 'For sample k, LIONESS uses the all-sample co-expression network and the co-expression network recomputed after removing k: N_k = n * N_all - (n - 1) * N_without_k.'
  - When a patient or sample identifier is supplied, report the leave-one-out network with that identifier explicitly and keep the sample-specific network separate from the aggregate network.
