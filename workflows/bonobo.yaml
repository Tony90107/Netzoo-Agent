policy_version: 2
workflow: BONOBO
action: run_bonobo
input_validator: run_bonobo
description: Infer sample-specific gene-gene co-expression networks with netZooPy BONOBO.
required_inputs: [expression_file, output_dir]
optional_inputs:
  [bonobo_output_format, sample_names, sparsify, bonobo_confidence, save_pvals, precision,
   keep_in_memory, delta, genes_axis, log_transformed, centered, taxon]
validation_steps: [inspect_bonobo_inputs]
controls:
  - name: bonobo_output_format
    type: enum
    default: .h5
    allowed_values: [.h5, .hdf, .txt, .csv]
    executor_argument: bonobo_output_format
  - name: sample_names
    type: string_list
    default: []
    selection_tags: [sample_specific]
    executor_argument: sample_names
    description: Explicit sample IDs; never positional sample indices.
  - name: sparsify
    type: boolean
    default: false
    selection_tags: [sparse_pvalue_coexpression]
    executor_argument: sparsify
  - name: bonobo_confidence
    type: number
    default: 0.05
    minimum: 0
    maximum: 1
    selection_tags: [sparse_pvalue_coexpression]
    executor_argument: bonobo_confidence
  - name: save_pvals
    type: boolean
    default: false
    selection_tags: [sparse_pvalue_coexpression]
    executor_argument: save_pvals
  - name: precision
    type: enum
    default: single
    allowed_values: [single, double]
    executor_argument: precision
  - name: keep_in_memory
    type: boolean
    default: false
    executor_argument: keep_in_memory
  - name: delta
    type: number
    default: null
    minimum: 0
    maximum: 1
    nullable: true
    executor_argument: delta
  - name: genes_axis
    type: enum
    default: auto
    allowed_values: [auto, rows, columns]
    executor_argument: genes_axis
  - name: log_transformed
    type: boolean
    default: null
    nullable: true
    executor_argument: log_transformed
  - name: centered
    type: boolean
    default: null
    nullable: true
    executor_argument: centered
execution_step: run_bonobo
output_capability:
  operation: infer
  artifact_type: coexpression_network
  entity_types: [gene]
  granularities: [sample_specific]
  regulator_types: []
  target_types: []
  guidance_predecessors: []
  input_artifacts: [expression_matrix]
  handoff_targets: []
  selection_tags: [sample_specific, coexpression, bayesian, sparse_pvalue_coexpression]
  produced_artifacts: [coexpression_network, pvalue_matrix]
  conditional_outputs:
    - when: {sparsify: false, save_pvals: false}
      produced_artifacts: [coexpression_network]
      semantics: >-
        full sample-specific gene-gene co-expression matrices; no p-value artifact is written
      manifest_expectations:
        sparsify_requested: false
        network_sparsified: false
        pvalue_thresholding_required: false
    - when: {sparsify: true, save_pvals: false}
      produced_artifacts: [coexpression_network]
      semantics: >-
        upstream thresholds each sample-specific co-expression matrix; no p-value artifact is written
      manifest_expectations:
        sparsify_requested: true
        network_sparsified: true
        pvalue_thresholding_required: false
    - when: {sparsify: true, save_pvals: true}
      produced_artifacts: [coexpression_network, pvalue_matrix]
      semantics: >-
        upstream retains the full co-expression matrix for each selected sample and writes a matching p-value matrix; threshold it from the saved p-value matrix; it does not also emit an already-thresholded network in this mode
      manifest_expectations:
        sparsify_requested: true
        network_sparsified: false
        pvalue_thresholding_required: true
    - when: {sparsify: false, save_pvals: true}
      produced_artifacts: []
      semantics: "invalid: save_pvals requires sparsify"
      valid: false
  prefer_when: [cohort_size:few, per_edge_confidence:needed]
  handoff_contract: >-
    BONOBO consumes a labelled gene-by-sample expression matrix and produces one
    gene-by-gene sample-specific co-expression matrix per selected sample, plus
    optional matching p-value matrices. It does not produce an aggregate/prior
    network, GRN, TF-gene regulation, or causal network. BONOBO output is not a
    direct PANDA/PUMA coexpression_file handoff: those workflows require one
    validated aggregate labeled gene-by-gene matrix. A separate explicit
    sample-selection or aggregation conversion is required, with its own
    validation and user confirmation. It is not a direct handoff to LIONESS,
    CONDOR, COBRA, DRAGON, or OTTER either.
conventions:
  - >-
    The verified netZooPy 0.11.0 public API is
    `netZooPy.bonobo.Bonobo(expression_file)` followed by
    `run_bonobo(output_folder, output_fmt, keep_in_memory, save_full,
    online_coexpression, delta, computing, cores, precision, sample_names,
    sparsify, confidence, save_pvals)`. The agent passes only the supported
    controls declared in this workflow and never invokes the BONOBO CLI.
  - >-
    The installed source reader uses header=0 and index_col=0, so the agent
    requires a labelled header: the first column is unique gene IDs and the
    remaining column names are unique sample IDs. A headerless matrix must be
    corrected before execution; the CLI's looser header description is not used
    as the executable contract.
  - >-
    Expression data must be numeric, finite, complete, gene-by-sample, and have
    at least three total samples so each leave-one-out background has at least
    two samples. The agent requires the caller to declare log_transformed=true
    and centered=true because BONOBO assumes log-transformed centered expression.
  - >-
    sample_names is an explicit list of sample IDs, never positional indices.
    Unknown or duplicate names are rejected before the API call and the selected
    names remain in manifest.json and the sample-to-file mapping.
  - >-
    output formats are exactly .h5/.hdf (HDF5), .txt, and .csv. Upstream writes a square
    matrix with gene IDs as columns and no row labels; HDF5 uses key bonobo and
    p-value HDF5 uses key pvals. TXT is tab-delimited and CSV is comma-delimited
    for the agent-owned artifact reader.
  - >-
    `sparsify` computes the upstream approximate p-values. With sparsify=true and
    save_pvals=false, upstream thresholds the co-expression matrix and does not
    save p-values. With both sparsify=true and save_pvals=true, upstream retains
    the full co-expression matrix and writes p-values for downstream thresholding;
    it does not also emit an already-thresholded network.
  - >-
    The agent rejects save_pvals=true without sparsify=true and does not claim
    that a p-value artifact is a GRN. Output verification is required after every
    run, and the manifest distinguishes a sparsification request from an actually
    thresholded network and from a network requiring p-value-based thresholding.
  - >-
    BONOBO has no aggregate/prior output. Its sample-specific matrices are not
    directly valid PANDA/PUMA coexpression_file inputs, which require one
    validated aggregate labeled gene-by-gene matrix; no implicit averaging or
    sample-index selection is performed.
