policy_version: 2
workflow: SAMBAR
action: run_sambar
description: Subtype somatic-mutation samples through pathway mutation scores with SAMBAR.
required_inputs: [mutation_file, exon_size_file, cancer_gene_file, pathway_file, output_dir]
optional_inputs: [norm_patient, kmin, kmax, gmt_msigdb, subset_cancer_genes, distance, linkage, cluster]
validation_steps: [inspect_sambar_inputs]
execution_step: run_sambar
output_capability:
  operation: analyze
  artifact_type: pathway_mutation_matrix
  entity_types: [sample, pathway]
  granularities: [aggregate]
  accepted_input_modalities: [somatic_mutation]
  produced_artifacts: [gene_mutation_scores, pathway_mutation_matrix, sample_cluster_assignment, sample_distance_matrix]
  transformations: [gene_length_normalization, patient_mutation_burden_normalization, pathway_aggregation, sample_distance, sample_clustering]
  scientific_objectives: [cancer_subtyping]
  incompatible_input_artifacts: [expression_matrix]
  selection_phrases: [somatic mutation, tumor mutation burden, gene length, pathway score, sparse mutation, patient clustering, 體細胞突變, 突變負荷, 基因長度, 途徑分數, 生物途徑, 稀疏, 病患分群, 亞型分群]
  regulator_types: []
  target_types: []
  guidance_predecessors: []
  input_artifacts: [mutation_matrix]
  handoff_targets: []
  selection_tags: [somatic_mutation, cancer_subtyping, pathway_scores]
  handoff_contract: >-
    SAMBAR consumes a samples-by-genes somatic mutation CSV, a gene-length CSV, a
    tab-delimited cancer-gene list, and a GMT pathway file. It produces gene and
    pathway mutation-score matrices plus optional sample cluster labels. These are
    not direct inputs to PANDA, PUMA, LIONESS-PANDA, LIONESS-PUMA, CONDOR, or COBRA;
    prepare and validate that workflow's declared input artifact separately before
    any composition.
conventions:
  - Mutation rows are unique sample IDs and mutation columns are unique gene IDs with non-negative numeric values.
  - The pinned SAMBAR implementation requires one positive numeric exon-length row whose CSV columns are unique gene IDs.
  - "The cancer-gene list follows the installed SAMBAR reader: one non-empty tab-delimited line of identifiers."
  - GMT rows contain a pathway name, description, and one or more gene identifiers.
  - All four inputs must have a non-empty four-way gene identifier overlap before execution.
  - cluster=true requires 2 <= kmin <= kmax <= number of mutation samples.
  - SAMBAR fixed-name runtime outputs are staged privately and then validated in output_dir; no SAMBAR result is a direct handoff to another registered workflow.
