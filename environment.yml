name: netzoo
channels:
  - netzoo
  - conda-forge
dependencies:
  - python=3.10
  - git
  - bash
  # netZooPy is loaded from the pinned source checkout in Dockerfile.
  # Its runtime dependencies are explicit here so a second shadowed netZooPy
  # package is not installed into site-packages.
  - click
  - h5py
  - igraph
  - joblib
  - matplotlib
  - networkx
  - numpy<2.0
  - pandas
  - scipy
  - statsmodels
  - pytables
  - pytorch
  - setuptools<81
  - pip
  - pip:
      - langchain>=1.0
      - langgraph>=1.0
      - langchain-openai>=1.0
      - langchain-mcp-adapters>=0.3,<0.4
      - prompt_toolkit>=3.0,<4
      - pyyaml>=6.0
      - typing-extensions>=4.12
      # Observer API and resilient trace upload.
      - fastapi==0.121.0
      - uvicorn==0.38.0
      - sqlalchemy==2.0.30
      - psycopg[binary]==3.2.10
      - httpx==0.26.0
      - boto3==1.40.66
