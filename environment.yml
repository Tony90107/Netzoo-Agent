name: netzoo
channels:
  - netzoo
  - conda-forge
dependencies:
  - python=3.10
  - git
  - bash
  # netZooPy is loaded from the pinned source checkout in Dockerfile.
  # Its runtime dependencies are explicit here so a second shadowed netZooPy
  # package is not installed into site-packages.
  - click
  - h5py
  # netZooPy imports the Python bindings, not only the igraph C library.
  - python-igraph
  - joblib
  - matplotlib
  - networkx
  - numpy<2.0
  - pandas
  # GIRAFFE imports patsy directly for optional covariate adjustment.
  - patsy
  - scipy
  - statsmodels
  - pytables
  - pytorch
  - setuptools<81
  - pip
  - pip:
      - langchain>=1.0
      - langgraph>=1.0
      - langchain-openai>=1.0
      - langchain-mcp-adapters>=0.3,<0.4
      # langchain-mcp-adapters 0.3.x imports RequestContext from the MCP 1.x
      # API.  Without this upper bound pip resolves MCP 2.x, where that symbol
      # moved, and every Websearch/Context7 call fails at import time.
      - mcp==1.30.0
      - prompt_toolkit>=3.0,<4
      - pyyaml>=6.0
      - typing-extensions>=4.12
      # Observer API and resilient trace upload.
      - fastapi==0.121.0
      - uvicorn==0.38.0
      - sqlalchemy==2.0.30
      - psycopg[binary]==3.2.10
      # MCP 1.30 requires httpx >=0.27.1; keep the observer client on the
      # same compatible major/minor line instead of forcing an unsatisfiable
      # 0.26 pin during environment creation.
      - httpx==0.27.2
      - boto3==1.40.66
