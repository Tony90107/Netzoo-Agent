name: netzoo_agent

services:
  netzoo:
    build:
      context: .
    image: netzoo_agent:latest
    working_dir: /work
    volumes:
      - .:/work
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_ROUTER_MODEL: ${OPENROUTER_ROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SEMANTIC_MODEL: ${OPENROUTER_SEMANTIC_MODEL:-openai/gpt-4o-mini}
      # The capability check's own model (a pinned gpt-4o-mini snapshot); empty = the semantic model.
      OPENROUTER_CAPABILITY_MODEL: ${OPENROUTER_CAPABILITY_MODEL:-openai/gpt-4o-mini-2024-07-18}
      NETZOO_RESPONSE_MODEL_ALLOWLIST: ${NETZOO_RESPONSE_MODEL_ALLOWLIST:-openai/gpt-4o-mini}
      NETZOO_ROUTER_MODEL_ALLOWLIST: ${NETZOO_ROUTER_MODEL_ALLOWLIST:-openai/gpt-4o-mini,openai/gpt-4o-mini-2024-07-18}
      NETZOO_ROUTER_MAX_TOKENS: ${NETZOO_ROUTER_MAX_TOKENS:-1200}
      NETZOO_RESPONSE_MAX_TOKENS: ${NETZOO_RESPONSE_MAX_TOKENS:-800}
      NETZOO_MAX_TASK_TOKENS: ${NETZOO_MAX_TASK_TOKENS:-30000}
      NETZOO_LLM_TIMEOUT_SECONDS: ${NETZOO_LLM_TIMEOUT_SECONDS:-30}
      NETZOO_TOOL_TIMEOUT_SECONDS: ${NETZOO_TOOL_TIMEOUT_SECONDS:-86400}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      CONTEXT7_MCP_URL: ${CONTEXT7_MCP_URL:-https://mcp.context7.com/mcp}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEBSEARCH_MCP_URL: ${WEBSEARCH_MCP_URL:-https://mcp.tavily.com/mcp}
      NETZOO_GENE_CACHE_PATH: ${NETZOO_GENE_CACHE_PATH:-/work/.netzoo/gene_validation.sqlite3}
      NETZOO_GENE_ONLINE_LOOKUP: ${NETZOO_GENE_ONLINE_LOOKUP:-auto}
      NETZOO_GENE_CACHE_TTL_DAYS: ${NETZOO_GENE_CACHE_TTL_DAYS:-90}
      NETZOO_GENE_CACHE_REVIEW_TTL_DAYS: ${NETZOO_GENE_CACHE_REVIEW_TTL_DAYS:-30}
      NETZOO_GENE_CACHE_MAX_ROWS: ${NETZOO_GENE_CACHE_MAX_ROWS:-100000}
      NETZOO_OBSERVER_URL: ${NETZOO_OBSERVER_URL:-http://observer-api:8000}
      NETZOO_OBSERVER_AGENT_KEY: ${NETZOO_OBSERVER_AGENT_KEY:-}
      NETZOO_OBSERVER_ALLOW_INSECURE: "true"
      # Decision layers that ship turned on: this is the configuration the agent is used with. Each can be
      # turned off in .env (e.g. NETZOO_NO_REASK=off); NETZOO_CLARIFY_MENU stays off by default.
      NETZOO_JEV_GUARD: ${NETZOO_JEV_GUARD:-on}
      NETZOO_JEV_OVERLAP: ${NETZOO_JEV_OVERLAP:-on}
      NETZOO_JEV_FORMS: ${NETZOO_JEV_FORMS:-on}
      NETZOO_AGENT_ANSWERS: ${NETZOO_AGENT_ANSWERS:-on}
      NETZOO_ANSWER_BUTTONS: ${NETZOO_ANSWER_BUTTONS:-on}
      NETZOO_COUNT_ANSWERS: ${NETZOO_COUNT_ANSWERS:-on}
      NETZOO_NO_REASK: ${NETZOO_NO_REASK:-on}
      NETZOO_CLARIFY_MENU: ${NETZOO_CLARIFY_MENU:-off}
      NETZOO_SETTING_RETYPE: ${NETZOO_SETTING_RETYPE:-on}
      NETZOO_NAMED_RUN_SENTENCE: ${NETZOO_NAMED_RUN_SENTENCE:-on}
      NETZOO_REGULATOR_SCOPE: ${NETZOO_REGULATOR_SCOPE:-on}
    command: bash

  # Long-lived daemon for the desktop UI. Same image and environment as the
  # interactive service; it differs only in what it runs and in binding a
  # loopback port.
  netzoo-daemon:
    extends:
      service: netzoo
    ports:
      - "127.0.0.1:${NETZOO_DAEMON_PORT:-8765}:8765"
    environment:
      NETZOO_DESKTOP_TOKEN: ${NETZOO_DESKTOP_TOKEN:-}
      # Only the desktop shell knows where the project lives on the host; the
      # daemon needs it to show paths a person can actually find in Finder.
      NETZOO_HOST_PROJECT_ROOT: ${NETZOO_HOST_PROJECT_ROOT:-}
      # Sealed traces older than this are pruned when a session starts.
      # Interrupted runs are never pruned, so this does not bound the store
      # on its own. Raise it when a run has to stay auditable for longer.
      NETZOO_TRACE_RETENTION_DAYS: ${NETZOO_TRACE_RETENTION_DAYS:-30}
      # The image bakes scripts/ into /opt/netzoo-app/scripts and puts it on
      # PYTHONPATH. Without this override the daemon would run the code as of
      # the last image build instead of the mounted working tree.
      PYTHONPATH: /work/scripts:/opt/netZooPy:/opt/netzoo-harness
    command:
      - python
      - -m
      - netzoo_agent_core.server
      - --host
      - 0.0.0.0
      - --port
      - "8765"

  # The same daemon with the window served as a web page, for people who run
  # NetZoo without building the desktop app (`./netzoo-web`). Its own port and
  # token keep it apart from a desktop app running at the same time.
  netzoo-web:
    extends:
      service: netzoo
    ports:
      - "127.0.0.1:${NETZOO_WEB_PORT:-8080}:8765"
    environment:
      NETZOO_DESKTOP_TOKEN: ${NETZOO_WEB_TOKEN:-}
      NETZOO_WEB_UI_DIR: /opt/netzoo-web
      NETZOO_WEB_PORT: ${NETZOO_WEB_PORT:-8080}
      NETZOO_HOST_PROJECT_ROOT: ${NETZOO_HOST_PROJECT_ROOT:-}
      NETZOO_TRACE_RETENTION_DAYS: ${NETZOO_TRACE_RETENTION_DAYS:-30}
      PYTHONPATH: /work/scripts:/opt/netZooPy:/opt/netzoo-harness
    command:
      - python
      - -m
      - netzoo_agent_core.server
      - --host
      - 0.0.0.0
      - --port
      - "8765"

# The optional observer stack lives in docker-compose.observer.yml. Keeping
# its required secrets out of this default file lets `docker compose run
# netzoo ...` work without pretending observer credentials exist.
