name: netzoo_agent

services:
  netzoo:
    build:
      context: .
    image: netzoo_agent:latest
    working_dir: /work
    volumes:
      - .:/work
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_ROUTER_MODEL: ${OPENROUTER_ROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_SEMANTIC_MODEL: ${OPENROUTER_SEMANTIC_MODEL:-openai/gpt-4o-mini}
      NETZOO_RESPONSE_MODEL_ALLOWLIST: ${NETZOO_RESPONSE_MODEL_ALLOWLIST:-openai/gpt-4o-mini}
      NETZOO_ROUTER_MODEL_ALLOWLIST: ${NETZOO_ROUTER_MODEL_ALLOWLIST:-openai/gpt-4o-mini}
      NETZOO_ROUTER_MAX_TOKENS: ${NETZOO_ROUTER_MAX_TOKENS:-1200}
      NETZOO_RESPONSE_MAX_TOKENS: ${NETZOO_RESPONSE_MAX_TOKENS:-800}
      NETZOO_MAX_TASK_TOKENS: ${NETZOO_MAX_TASK_TOKENS:-20000}
      NETZOO_LLM_TIMEOUT_SECONDS: ${NETZOO_LLM_TIMEOUT_SECONDS:-30}
      NETZOO_TOOL_TIMEOUT_SECONDS: ${NETZOO_TOOL_TIMEOUT_SECONDS:-86400}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      CONTEXT7_MCP_URL: ${CONTEXT7_MCP_URL:-https://mcp.context7.com/mcp}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEBSEARCH_MCP_URL: ${WEBSEARCH_MCP_URL:-https://mcp.tavily.com/mcp}
      NETZOO_GENE_CACHE_PATH: ${NETZOO_GENE_CACHE_PATH:-/work/.netzoo/gene_validation.sqlite3}
      NETZOO_GENE_ONLINE_LOOKUP: ${NETZOO_GENE_ONLINE_LOOKUP:-auto}
      NETZOO_GENE_CACHE_TTL_DAYS: ${NETZOO_GENE_CACHE_TTL_DAYS:-90}
      NETZOO_GENE_CACHE_REVIEW_TTL_DAYS: ${NETZOO_GENE_CACHE_REVIEW_TTL_DAYS:-30}
      NETZOO_GENE_CACHE_MAX_ROWS: ${NETZOO_GENE_CACHE_MAX_ROWS:-100000}
      NETZOO_OBSERVER_URL: ${NETZOO_OBSERVER_URL:-http://observer-api:8000}
      NETZOO_OBSERVER_AGENT_KEY: ${NETZOO_OBSERVER_AGENT_KEY:-}
      NETZOO_OBSERVER_ALLOW_INSECURE: "true"
    command: bash

  # Long-lived daemon for the desktop UI. Same image and environment as the
  # interactive service; it differs only in what it runs and in binding a
  # loopback port.
  netzoo-daemon:
    extends:
      service: netzoo
    ports:
      - "127.0.0.1:${NETZOO_DAEMON_PORT:-8765}:8765"
    environment:
      NETZOO_DESKTOP_TOKEN: ${NETZOO_DESKTOP_TOKEN:-}
      # The image bakes scripts/ into /opt/netzoo-app/scripts and puts it on
      # PYTHONPATH. Without this override the daemon would run the code as of
      # the last image build instead of the mounted working tree.
      PYTHONPATH: /work/scripts:/opt/netZooPy:/opt/netzoo-harness
    command:
      - python
      - -m
      - netzoo_agent_core.server
      - --host
      - 0.0.0.0
      - --port
      - "8765"

# The optional observer stack lives in docker-compose.observer.yml. Keeping
# its required secrets out of this default file lets `docker compose run
# netzoo ...` work without pretending observer credentials exist.
