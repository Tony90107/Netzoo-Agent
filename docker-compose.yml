services:
  netzoo:
    build:
      context: .
    image: netzoo-panda-puma:latest
    working_dir: /work
    volumes:
      - .:/work
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_ROUTER_MODEL: ${OPENROUTER_ROUTER_MODEL:-openai/gpt-4o-mini}
      NETZOO_RESPONSE_MODEL_ALLOWLIST: ${NETZOO_RESPONSE_MODEL_ALLOWLIST:-openai/gpt-4o-mini}
      NETZOO_ROUTER_MODEL_ALLOWLIST: ${NETZOO_ROUTER_MODEL_ALLOWLIST:-openai/gpt-4o-mini}
      NETZOO_ROUTER_MAX_TOKENS: ${NETZOO_ROUTER_MAX_TOKENS:-500}
      NETZOO_RESPONSE_MAX_TOKENS: ${NETZOO_RESPONSE_MAX_TOKENS:-800}
      NETZOO_MAX_TASK_TOKENS: ${NETZOO_MAX_TASK_TOKENS:-20000}
      NETZOO_LLM_TIMEOUT_SECONDS: ${NETZOO_LLM_TIMEOUT_SECONDS:-30}
      NETZOO_TOOL_TIMEOUT_SECONDS: ${NETZOO_TOOL_TIMEOUT_SECONDS:-86400}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      CONTEXT7_MCP_URL: ${CONTEXT7_MCP_URL:-https://mcp.context7.com/mcp}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEBSEARCH_MCP_URL: ${WEBSEARCH_MCP_URL:-https://mcp.tavily.com/mcp}
      NETZOO_OBSERVER_URL: ${NETZOO_OBSERVER_URL:-http://observer-api:8000}
      NETZOO_OBSERVER_AGENT_KEY: ${NETZOO_OBSERVER_AGENT_KEY:-}
      NETZOO_OBSERVER_ALLOW_INSECURE: "true"
    networks:
      - observer-edge
      - observer-internal
    command: bash

  observer-api:
    build:
      context: .
    image: netzoo-panda-puma:latest
    restart: unless-stopped
    depends_on:
      observer-db:
        condition: service_healthy
      observer-object-store:
        condition: service_healthy
    environment:
      NETZOO_OBSERVER_DATABASE_URL: postgresql+psycopg://netzoo:${NETZOO_OBSERVER_DB_PASSWORD:?set NETZOO_OBSERVER_DB_PASSWORD}@observer-db:5432/netzoo_observer
      NETZOO_OBSERVER_CREDENTIAL_PEPPER: ${NETZOO_OBSERVER_CREDENTIAL_PEPPER:?set NETZOO_OBSERVER_CREDENTIAL_PEPPER}
      NETZOO_OBSERVER_AGENT_KEY: ${NETZOO_OBSERVER_AGENT_KEY:?set NETZOO_OBSERVER_AGENT_KEY}
      NETZOO_OBSERVER_ADMIN_KEY: ${NETZOO_OBSERVER_ADMIN_KEY:?set NETZOO_OBSERVER_ADMIN_KEY}
      NETZOO_OBSERVER_OBJECT_ENDPOINT: http://observer-object-store:9000
      NETZOO_OBSERVER_OBJECT_BUCKET: netzoo-traces
      NETZOO_OBSERVER_OBJECT_ACCESS_KEY: ${NETZOO_OBSERVER_OBJECT_ACCESS_KEY:?set NETZOO_OBSERVER_OBJECT_ACCESS_KEY}
      NETZOO_OBSERVER_OBJECT_SECRET_KEY: ${NETZOO_OBSERVER_OBJECT_SECRET_KEY:?set NETZOO_OBSERVER_OBJECT_SECRET_KEY}
    command:
      - uvicorn
      - netzoo_observer.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --no-access-log
    ports:
      - 127.0.0.1:${NETZOO_OBSERVER_PORT:-8000}:8000
    networks:
      - observer-edge
      - observer-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10

  observer-db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netzoo_observer
      POSTGRES_USER: netzoo
      POSTGRES_PASSWORD: ${NETZOO_OBSERVER_DB_PASSWORD:?set NETZOO_OBSERVER_DB_PASSWORD}
    volumes:
      - observer-db-data:/var/lib/postgresql/data
    networks:
      - observer-internal
    healthcheck:
      test: [CMD-SHELL, pg_isready -U netzoo -d netzoo_observer]
      interval: 5s
      timeout: 3s
      retries: 20

  observer-object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${NETZOO_OBSERVER_OBJECT_ACCESS_KEY:?set NETZOO_OBSERVER_OBJECT_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${NETZOO_OBSERVER_OBJECT_SECRET_KEY:?set NETZOO_OBSERVER_OBJECT_SECRET_KEY}
    command: [server, /data]
    volumes:
      - observer-object-data:/data
    networks:
      - observer-internal
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  observer-db-data:
  observer-object-data:

networks:
  observer-edge:
  observer-internal:
    internal: true
