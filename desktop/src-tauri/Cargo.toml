[package]
name = "netzoo-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "netzoo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
