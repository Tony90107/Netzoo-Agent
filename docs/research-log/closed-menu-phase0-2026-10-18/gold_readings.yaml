# Closed-menu judgment, phase 0: the gold reading of each of the 56 bench items (core-judgment-2026-10-15/items.json
# minus C01, C02, C03, C05), written by hand to the reading rules of spec sections 3.1, 3.3 and 9.2:
# - stated = explicit, or implied by words as clear as saying it (draft 3); "a network" implies no scale;
# - miRNA regulators and comparisons are extras: never mentioned -> not stated (plain);
# - a doubt between alternatives is `conflicting` with those alternatives as `values`;
# - named workflows are counted by code from the prompt, never written here.
# Shorthand: `artifact: regulatory_network` is stated (explicit); `{status: conflicting, values: [...]}` otherwise.
# `judgment` notes where a reading rests on a call the phase-1 reader may make differently.
# `fact`: for ask items, the question dimensions that target the gold deciding fact (or `settled` for a file doubt a
# run's input check settles). This file is never tuned against the decision table: a gate miss is reported, not fixed
# here.

